name: Tests

on:
  push:
  pull_request:

jobs:
  headless-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # bpy 5.0 wheels are built for Python 3.11 only
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            pyproject.toml

      - name: Install system libraries for bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1

      - name: Install dependencies
        run: pip install -e . -r tests/requirements.txt

      - name: Run tests
        env:
          DISABLE_TELEMETRY: "1"
        run: python -m pytest tests -v
